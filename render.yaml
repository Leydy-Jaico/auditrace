services:
  - type: web
    name: auditrace
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: HOST_ACCESS_KEY
        sync: false
